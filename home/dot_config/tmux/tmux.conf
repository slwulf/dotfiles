# Set prefix keychord to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set up tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Mirror zsh prompt's SSH_CLIENT/SSH_TTY check in the status bar
set -ag update-environment 'SSH_CLIENT'
set -ag update-environment 'SSH_TTY'

# Truecolor passthrough (tmux reports Tc/RGB missing by default without this)
set -ga terminal-overrides ',*:Tc'

# Status bar
set -g status-style 'bg=#a291a5,fg=#492066,bold'
set -g status-left-length 20
set -g status-left ' #[fg=#492066,bold]#S #[fg=#492066,bold]| '
set -g status-right-length 80
set -g status-right '#{?#{||:#{SSH_CLIENT},#{SSH_TTY}},#[fg=white]#[bold]🦄 ssh,#[fg=white]#[bold]💩 local} #[fg=#492066,bold]| #[fg=white,bold]continuum: #{continuum_status} #[fg=#492066,bold]| #[fg=#492066,bold]%Y-%m-%d %H:%M '
setw -g window-status-current-style 'fg=white,bg=#492066,bold'
setw -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags}, } '
setw -g window-status-style 'fg=#492066,bg=#a291a5,bold'

# Active pane border
set -g pane-active-border-style 'fg=#a291a5'

# Run tmux plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

